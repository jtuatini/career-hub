[project]
name = "application-bot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.120.0",
    "fastapi>=0.140.7",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "pypdfium2>=5.12.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
