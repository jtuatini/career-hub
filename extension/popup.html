<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #17181c;
        --surface: #1f2127;
        --ink: #e9e7e2;
        --ink-soft: #a0a3ab;
        --hairline: #34373e;
        --accent: #8aa3f5;
        --accent-soft: #222b4a;
        --redline: #e07a6f;
      }
      body {
        margin: 0;
        width: 280px;
        background: var(--bg);
        color: var(--ink);
        font: 13.5px/1.45 -apple-system, "Segoe UI", sans-serif;
        padding: 14px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      button {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--hairline);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button strong { display: block; font-size: 13.5px; }
      button span { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
      #run-pipeline { border-color: var(--accent-soft); background: linear-gradient(180deg, rgba(138, 163, 245, 0.08), var(--surface)); }
      .stop { border-color: var(--redline); color: var(--redline); }
      .note { font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; }
      .opts {
        margin: -2px 0 10px;
        padding: 8px 12px;
        border: 1px solid var(--hairline);
        border-radius: 8px;
        background: var(--bg);
      }
      .opts label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        font-size: 12.5px;
        color: var(--ink-soft);
        cursor: pointer;
      }
      .opts input { accent-color: var(--accent); }
      .opts label:has(input:checked) { color: var(--ink); }
      .status { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; }
      .status b { color: var(--ink); font-weight: 600; }
      a { color: var(--accent); font-size: 12px; text-decoration: none; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>Application Copilot</h1>

    <div id="capture" class="hidden">
      <button id="save-profile">
        <strong>💼 Save this profile to Copilot</strong>
        <span>Adds the person you're viewing to your Network tab.</span>
      </button>
      <p class="note" id="capture-result"></p>
    </div>

    <div id="idle" class="hidden">
      <button id="run-pipeline">
        <strong>▶ Run pipeline</strong>
        <span>Read the posting, generate what's enabled below, then fill the form.</span>
      </button>
      <div class="opts">
        <label><input type="checkbox" id="opt-tailor" /> Tailor résumé</label>
        <label><input type="checkbox" id="opt-cover" /> Write cover letter</label>
        <label><input type="checkbox" id="opt-answers" /> Draft question answers</label>
      </div>
      <button id="tailor-only">
        <strong>✂ Tailor résumé only</strong>
        <span>Read the posting, tailor your résumé, attach it. No other fields touched.</span>
      </button>
      <button id="fill-only">
        <strong>✎ Fill application only</strong>
        <span>Fill the form from your saved profile. No AI documents generated.</span>
      </button>
      <p class="note">Nothing is ever submitted for you — you always click Submit yourself.</p>
    </div>

    <div id="active" class="hidden">
      <p class="status">Session <b id="stage">running</b> on this tab.</p>
      <button id="reconnect" class="hidden">
        <strong>↻ Reconnect</strong>
        <span>The page lost contact after a navigation — resume filling.</span>
      </button>
      <button id="download-resume" class="hidden">
        <strong>⬇ Download tailored résumé</strong>
        <span>Saved to your resume bank — grab the PDF here.</span>
      </button>
      <button id="stop" class="stop"><strong>■ Stop session</strong></button>
    </div>

    <div id="nopage" class="hidden">
      <p class="status">Open a job application page first, then click the icon.</p>
    </div>

    <p class="note"><a href="#" id="settings">Settings</a></p>
    <script src="popup.js"></script>
  </body>
</html>
